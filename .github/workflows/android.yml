name: Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      disable_cache:
        description: 'Run without Gradle caches to diagnose cache-related failures'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Keep this check present even for docs-only PRs: main requires this name.
    name: Build and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test CI change detection
        run: python3 -B -m unittest discover -s .github/scripts -p 'test_*.py'

      - name: Detect changes requiring Android checks
        id: changes
        run: python3 -B .github/scripts/ci_changes.py

      - name: Set up JDK 17
        if: steps.changes.outputs.build_required == 'true'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        if: steps.changes.outputs.build_required == 'true'
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          # PRs only read caches; main and maintainer-triggered runs can populate them.
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          cache-disabled: ${{ github.event_name == 'workflow_dispatch' && inputs.disable_cache }}

      - name: Set up Android SDK
        if: steps.changes.outputs.build_required == 'true'
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
          log-accepted-android-sdk-licenses: false

      - name: Build debug APK, run Android Lint and unit tests
        id: checks
        if: steps.changes.outputs.build_required == 'true'
        env:
          BUILD_CACHE_OPTION: ${{ github.event_name == 'workflow_dispatch' && inputs.disable_cache && '--no-build-cache' || '--build-cache' }}
        run: ./gradlew --no-daemon --continue "$BUILD_CACHE_OPTION" :app:assembleDebug :app:lintDebug :app:testDebugUnitTest

      - name: Upload debug APK
        if: steps.changes.outputs.build_required == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pleos-app-2026-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload Lint and unit test reports
        if: ${{ !cancelled() && (steps.checks.outcome == 'success' || steps.checks.outcome == 'failure') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-reports
          path: |
            app/build/reports/lint-results-debug.*
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/*.xml
          if-no-files-found: ignore
          retention-days: 7
