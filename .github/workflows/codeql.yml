name: CodeQL

on:
  push:
    branches: [main]
    paths-ignore: ['README.md', 'docs/**']
  # All PR bases, so stacked PRs are scanned before they reach main.
  pull_request:
    paths-ignore: ['README.md', 'docs/**']
  schedule:
    # Monday 03:27 KST: pick up new CodeQL queries even without code changes.
    - cron: '27 18 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    # Not a required check. Keep the repository's code scanning "default setup"
    # disabled: GitHub rejects advanced-setup uploads while it is enabled.
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: java-kotlin
            build-mode: manual
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Set up JDK 17
        if: matrix.build-mode == 'manual'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        if: matrix.build-mode == 'manual'
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          # Reuse the Android workflow's dependency cache without adding entries.
          cache-read-only: true

      - name: Set up Android SDK
        if: matrix.build-mode == 'manual'
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
          log-accepted-android-sdk-licenses: false

      - name: Compile app sources for CodeQL
        if: matrix.build-mode == 'manual'
        # CodeQL only extracts code the compiler actually runs on, so disable the
        # build cache and keep the Kotlin compiler inside the traced Gradle process.
        run: >-
          ./gradlew --no-daemon --no-build-cache
          -Pkotlin.compiler.execution.strategy=in-process
          :app:compileDebugSources

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}
